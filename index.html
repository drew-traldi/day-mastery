<!doctype html>
<html lang="en" data-theme="sunrise" data-mode="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Day Mastery</title>
<meta name="description" content="Grow a little every day. Focus, habits, breathing, sleep, water, a journal and more in one calm app.">
<meta name="theme-color" content="#fbf5ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Day Mastery">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
  // Apply the saved theme before first paint so there is no flash of the default colors.
  try {
    var st = (JSON.parse(localStorage.getItem('dayMastery') || '{}').settings) || {};
    document.documentElement.dataset.theme = st.theme || 'sunrise';
    document.documentElement.dataset.mode = st.mode || 'auto';
    if (st.theme === 'custom' && st.custom) document.documentElement.style.setProperty('--accent', st.custom);
  } catch (e) {}
</script>
</head>
<body>
<main id="view"></main>
<div id="mini"></div>
<nav id="tabs" aria-label="Main"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Day Mastery needs JavaScript turned on.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
